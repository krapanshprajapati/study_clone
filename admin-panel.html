<!DOCTYPE html><html lang="hi"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Study Zone Admin</title>
<style>body{font-family:system-ui,sans-serif;max-width:760px;margin:0 auto;padding:14px;background:#f5f5f7;color:#222}.c{background:#fff;border-radius:10px;padding:12px;margin:10px 0;box-shadow:0 1px 3px #0002}
input,textarea{width:100%;box-sizing:border-box;padding:8px;margin:3px 0 8px;border:1px solid #ccc;border-radius:6px;font:inherit}button{background:#ff416c;color:#fff;border:0;padding:12px 16px;border-radius:8px;font:inherit;width:100%;margin:6px 0}small{color:#666}</style></head><body>
<h2>Study Zone - पैकेज मैनेजर</h2>
<p><small>यहाँ से हर पैकेज का Sample PDF, Razorpay Payment Link और "क्या मिलेगा" भरें। फिर नीचे का बटन दबाकर <b>packages.json</b> डाउनलोड करें और GitHub में पुरानी फ़ाइल की जगह अपलोड करें। इसमें कोई पासवर्ड या secret नहीं रखना है।</small></p>
<input type="file" id="up" accept=".json" style="display:none"><div id="app">लोड हो रहा है...</div><button onclick="dl()">packages.json डाउनलोड करें</button>
<script>
let D={packages:[]};const app=document.getElementById('app');
function draw(){app.innerHTML='';D.packages.forEach((p,i)=>{const d=document.createElement('div');d.className='c';
d.innerHTML='<b></b> <small>₹'+p.price+'</small><label><small>Sample PDF का पाथ (जैसे samples/ssc-cgl.pdf)</small><input data-i="'+i+'" data-k="sample"></label><label><small>Razorpay Payment Link</small><input data-i="'+i+'" data-k="paymentLink"></label><label><small>इसमें क्या मिलेगा (हर लाइन में एक बात)</small><textarea rows="4" data-i="'+i+'" data-k="contents"></textarea></label>';
d.querySelector('b').textContent=p.name;
d.querySelectorAll('[data-k]').forEach(e=>{const k=e.dataset.k;e.value=k=='contents'?p.contents.join('\n'):p[k];
e.oninput=()=>{p[k]=k=='contents'?e.value.split('\n').map(x=>x.trim()).filter(Boolean):e.value.trim()}});app.appendChild(d)})}
fetch('packages.json?'+Date.now()).then(r=>r.json()).then(j=>{D=j;draw()}).catch(()=>{app.innerHTML='<p>packages.json नहीं मिली। नीचे से चुनें:</p>';const u=document.getElementById('up');u.style.display='block';u.onchange=()=>u.files[0].text().then(t=>{D=JSON.parse(t);u.style.display='none';draw()})});
function dl(){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([JSON.stringify(D,null,2)],{type:'application/json'}));a.download='packages.json';a.click()}
</script></body></html>
